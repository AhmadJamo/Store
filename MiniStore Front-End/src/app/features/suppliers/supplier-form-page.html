<section class="supplier-page">
  <app-page-header eyebrow="P2P" [title]="i18n.text(id ? 'editSupplier' : 'newSupplier')" [description]="i18n.text('supplierFormDescription')"><a class="ui-button secondary" routerLink="/suppliers">{{ i18n.text('cancel') }}</a></app-page-header>
  @if (!page() && !problem()) { <app-feedback-state kind="loading" [title]="i18n.text('loading')" /> }
  @if (problem()) { <app-form-error-summary [title]="problem()" [errors]="fieldErrors()" (fieldRequested)="focusField($event)" /> }
  @if (page(); as options) {
    <form appSafeFormShortcuts [saving]="saving()" (saveShortcut)="save()" [formGroup]="form" (ngSubmit)="save()" novalidate>
      <fieldset><legend>{{ i18n.text('profile') }}</legend><div class="form-grid">
        <label class="ui-field"><span>{{ i18n.text('supplierName') }} *</span><input formControlName="name" autocomplete="organization" />@if (errorFor('name')) { <small>{{ errorFor('name') }}</small> }</label>
        <label class="ui-field"><span>{{ i18n.text('legalName') }}</span><input formControlName="legalName" /></label>
        <label class="ui-field"><span>{{ i18n.text('contactPerson') }}</span><input formControlName="contactPerson" autocomplete="name" /></label>
        <label class="ui-field"><span>{{ i18n.text('phone') }}</span><input formControlName="phone" autocomplete="tel" /></label>
        <label class="ui-field"><span>{{ i18n.text('email') }}</span><input formControlName="email" type="email" autocomplete="email" />@if (errorFor('email')) { <small>{{ errorFor('email') }}</small> }</label>
        <label class="ui-field"><span>{{ i18n.text('website') }}</span><input formControlName="website" type="url" /></label>
        <label class="ui-field"><span>{{ i18n.text('registrationNumber') }}</span><input formControlName="registrationNumber" /></label>
        <label class="ui-field"><span>{{ i18n.text('taxNumber') }}</span><input formControlName="taxNumber" /></label>
        <label class="ui-field full"><span>{{ i18n.text('address') }}</span><textarea formControlName="address" rows="2"></textarea></label>
        <label class="ui-field full"><span>{{ i18n.text('notes') }}</span><textarea formControlName="notes" rows="3"></textarea></label>
      </div></fieldset>
      <fieldset><legend>{{ i18n.text('commercialDefaults') }}</legend><div class="form-grid">
        <label class="ui-field"><span>{{ i18n.text('payableAccount') }} *</span><select formControlName="accountId"><option [ngValue]="0">{{ i18n.text('selectOption') }}</option>@for (account of options.accounts; track account.id) { <option [ngValue]="account.id">{{ account.code }} — {{ account.name }}</option> }</select>@if (errorFor('accountId')) { <small>{{ errorFor('accountId') }}</small> }</label>
        <label class="ui-field"><span>{{ i18n.text('paymentTermDays') }}</span><input formControlName="paymentTermsDays" type="number" min="0" max="3650" /></label>
        <label class="check-field"><input formControlName="isActive" type="checkbox" /> {{ i18n.text('active') }}</label>
        <label class="ui-field full"><span>{{ i18n.text('assignedProducts') }}</span><select formControlName="productIds" multiple size="8">@for (product of options.products; track product.id) { <option [ngValue]="product.id">{{ product.code }} — {{ product.name }}</option> }</select><small class="hint">{{ i18n.text('productSelectionHint') }}</small></label>
      </div></fieldset>
      <footer class="form-actions"><span class="shortcut-hint">{{ i18n.text('saveShortcutHint') }}</span><a class="ui-button secondary" routerLink="/suppliers">{{ i18n.text('cancel') }}</a><button class="ui-button primary" type="submit" [disabled]="saving()">{{ saving() ? i18n.text('saving') : i18n.text('save') }}</button></footer>
    </form>
  }
</section>
