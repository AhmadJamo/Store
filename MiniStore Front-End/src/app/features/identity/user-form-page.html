<section class="identity-page"><app-page-header eyebrow="ADMIN" [title]="i18n.text('addUser')" [description]="i18n.text('addUserDescription')"/>@if(loading()){<app-feedback-state kind="loading" [title]="i18n.text('loading')"/>}@else{@if(problem();as failure){<app-api-recovery [problem]="failure" [allowRetry]="false"/>}<form class="identity-form" appSafeFormShortcuts [saving]="saving()" (saveShortcut)="save()" [formGroup]="form" (ngSubmit)="save()"><label class="ui-field"><span>{{i18n.text('userName')}}</span><input formControlName="userName" autocomplete="username" maxlength="100"/></label><label class="ui-field"><span>{{i18n.text('email')}}</span><input formControlName="email" type="email" autocomplete="email" maxlength="256"/></label><label class="ui-field"><span>{{i18n.text('password')}}</span><input formControlName="password" type="password" autocomplete="new-password"/><small>{{i18n.text('passwordSecurityHint')}}</small></label><label class="ui-field"><span>{{i18n.text('companyRole')}}</span><select formControlName="roleId"><option [value]="0">{{i18n.text('selectRole')}}</option>@for(role of roles();track role.id){<option [value]="role.id">{{role.name}}{{role.isSystem?' · '+i18n.text('protectedRole'):''}}</option>}</select></label><footer><a class="ui-button secondary" routerLink="/users">{{i18n.text('cancel')}}</a><button class="ui-button primary" [disabled]="form.invalid||saving()">{{saving()?i18n.text('saving'):i18n.text('createUser')}}</button></footer></form>}</section>
