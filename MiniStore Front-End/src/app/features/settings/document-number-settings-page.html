<section class="settings-form-page"><app-page-header eyebrow="ADMIN" [title]="i18n.text('documentNumbers')" [description]="i18n.text('documentNumbersDescription')"/>@if(loading()){<app-feedback-state kind="loading" [title]="i18n.text('loading')"/>}@else{@if(problem();as failure){<app-api-recovery [problem]="failure" [allowRetry]="false"/>}@if(saved()){<p class="save-status" role="status">{{i18n.text('documentNumbersSaved')}}</p>}<form appSafeFormShortcuts [saving]="saving()" (saveShortcut)="save()" [formGroup]="form" (ngSubmit)="save()"><div formArrayName="sequences" class="sequence-grid">@for(row of rows.controls;track index;let index=$index){<section class="form-card" [formGroupName]="index"><header><h2>{{name(row)}}</h2><strong>{{row.value.preview}}</strong></header><div class="form-grid"><label class="ui-field"><span>{{i18n.text('prefix')}}</span><input formControlName="prefix" maxlength="30"/></label><label class="ui-field"><span>{{i18n.text('suffix')}}</span><input formControlName="suffix" maxlength="30"/></label><label class="ui-field wide-field"><span>{{i18n.text('formatTemplate')}}</span><input formControlName="formatTemplate" maxlength="120"/></label><label class="ui-field"><span>{{i18n.text('numberLength')}}</span><input type="number" min="1" max="18" formControlName="numberLength"/></label><label class="ui-field"><span>{{i18n.text('nextNumber')}}</span><input type="number" min="1" formControlName="nextNumber"/></label><label class="ui-field"><span>{{i18n.text('resetStart')}}</span><input type="number" min="1" formControlName="resetStartNumber"/></label><label class="ui-field"><span>{{i18n.text('resetPeriod')}}</span><select formControlName="resetPeriod"><option [value]="0">{{i18n.text('never')}}</option><option [value]="1">{{i18n.text('yearly')}}</option><option [value]="2">{{i18n.text('monthly')}}</option><option [value]="3">{{i18n.text('daily')}}</option></select></label></div></section>}</div><footer class="form-actions"><a class="ui-button secondary" routerLink="/settings">{{i18n.text('back')}}</a><button class="ui-button primary" [disabled]="saving()||form.invalid||!form.dirty">{{saving()?i18n.text('saving'):i18n.text('save')}}</button></footer></form>}</section>
