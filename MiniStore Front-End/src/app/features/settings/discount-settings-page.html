<section class="settings-form-page"><app-page-header eyebrow="ADMIN" [title]="i18n.text('discountSettings')" [description]="i18n.text('discountSettingsDescription')"/>@if(loading()){<app-feedback-state kind="loading" [title]="i18n.text('loading')"/>}@else{@if(problem();as failure){<app-api-recovery [problem]="failure" [allowRetry]="false"/>}@if(saved()){<p class="save-status" role="status">{{i18n.text('discountSettingsSaved')}}</p>}<form appSafeFormShortcuts [saving]="saving()" (saveShortcut)="save()" [formGroup]="form" (ngSubmit)="save()"><section class="form-card"><div class="checks"><label><input type="checkbox" formControlName="enabled"/>{{i18n.text('enableDiscounts')}}</label><label><input type="checkbox" formControlName="allowLineDiscount"/>{{i18n.text('allowLineDiscount')}}</label><label><input type="checkbox" formControlName="allowInvoiceDiscount"/>{{i18n.text('allowInvoiceDiscount')}}</label><label><input type="checkbox" formControlName="allowPercentageDiscount"/>{{i18n.text('percentageDiscount')}}</label><label><input type="checkbox" formControlName="allowFixedAmountDiscount"/>{{i18n.text('fixedAmountDiscount')}}</label></div></section><section class="form-card"><div class="form-grid"><label class="ui-field"><span>{{i18n.text('defaultDiscountType')}}</span><select formControlName="defaultDiscountType"><option [value]="1">{{i18n.text('percentageDiscount')}}</option><option [value]="2">{{i18n.text('fixedAmountDiscount')}}</option></select></label><label class="ui-field"><span>{{i18n.text('maxLineDiscountPercent')}}</span><input type="number" min="0" max="100" formControlName="maxLineDiscountPercent"/></label><label class="ui-field"><span>{{i18n.text('maxLineDiscountAmount')}}</span><input type="number" min="0" formControlName="maxLineDiscountAmount"/></label><label class="ui-field"><span>{{i18n.text('maxInvoiceDiscountPercent')}}</span><input type="number" min="0" max="100" formControlName="maxInvoiceDiscountPercent"/></label><label class="ui-field"><span>{{i18n.text('maxInvoiceDiscountAmount')}}</span><input type="number" min="0" formControlName="maxInvoiceDiscountAmount"/></label><label class="ui-field"><span>{{i18n.text('overridePermission')}}</span><input formControlName="discountOverridePermission"/></label><label class="checks"><input type="checkbox" formControlName="allowDiscountAboveLimit"/>{{i18n.text('allowDiscountAboveLimit')}}</label></div></section><footer class="form-actions"><a class="ui-button secondary" routerLink="/settings">{{i18n.text('back')}}</a><button class="ui-button primary" [disabled]="saving()||form.invalid||!form.dirty">{{saving()?i18n.text('saving'):i18n.text('save')}}</button></footer></form>}</section>
