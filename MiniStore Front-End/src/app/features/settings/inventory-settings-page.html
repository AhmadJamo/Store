<section class="settings-form-page"><app-page-header eyebrow="ADMIN" [title]="i18n.text('inventorySettings')" [description]="i18n.text('inventorySettingsDescription')"/>@if(loading()){<app-feedback-state kind="loading" [title]="i18n.text('loading')"/>}@else{@if(problem();as failure){<app-api-recovery [problem]="failure" [allowRetry]="false"/>}@if(saved()){<p class="save-status" role="status">{{i18n.text('inventorySettingsSaved')}}</p>}<form appSafeFormShortcuts [saving]="saving()" (saveShortcut)="save()" [formGroup]="form" (ngSubmit)="save()"><section class="form-card"><h2>{{i18n.text('newWarehouseDefaults')}}</h2><div class="form-grid"><label class="ui-field"><span>{{i18n.text('warehouseType')}}</span><select formControlName="defaultWarehouseType">@for(option of warehouseTypes;track option.value){<option [value]="option.value">{{i18n.text(option.label)}}</option>}</select></label><label class="ui-field"><span>{{i18n.text('inventoryControlMode')}}</span><select formControlName="defaultControlMode">@for(option of controlModes;track option.value){<option [value]="option.value">{{i18n.text(option.label)}}</option>}</select></label><label class="ui-field"><span>{{i18n.text('pickingStrategy')}}</span><select formControlName="defaultPickingStrategy">@for(option of pickingStrategies;track option.value){<option [value]="option.value">{{i18n.text(option.label)}}</option>}</select></label></div><p>{{i18n.text('inventoryControlHint')}}</p></section><section class="form-card"><h2>{{i18n.text('operationalDefaults')}}</h2><label class="check-row"><input type="checkbox" formControlName="defaultAllowPosSales"/><span>{{i18n.text('allowPosSales')}}</span></label><label class="check-row"><input type="checkbox" formControlName="defaultEnforceLocationCapacity"/><span>{{i18n.text('enforceLocationCapacity')}}</span></label><label class="check-row"><input type="checkbox" formControlName="defaultRequireSourceLocationForTransfers" [disabled]="!locationManaged()"/><span>{{i18n.text('requireSourceLocation')}}</span></label><label class="check-row"><input type="checkbox" formControlName="defaultRequireDestinationLocationForTransfers" [disabled]="!locationManaged()"/><span>{{i18n.text('requireDestinationLocation')}}</span></label></section><footer class="form-actions"><a class="ui-button secondary" routerLink="/settings">{{i18n.text('back')}}</a><button class="ui-button primary" [disabled]="saving()||form.invalid||!form.dirty">{{saving()?i18n.text('saving'):i18n.text('save')}}</button></footer></form>}</section>
