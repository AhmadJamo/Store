<section class="settings-form-page"><app-page-header eyebrow="ADMIN" [title]="i18n.text('purchaseSourcing')" [description]="i18n.text('purchaseSourcingDescription')"/>@if(loading()){<app-feedback-state kind="loading" [title]="i18n.text('loading')"/>}@else{@if(problem();as failure){<app-api-recovery [problem]="failure" [allowRetry]="false"/>}@if(saved()){<p class="save-status" role="status">{{i18n.text('purchaseSourcingSaved')}}</p>}<form appSafeFormShortcuts [saving]="saving()" (saveShortcut)="save()" [formGroup]="form" (ngSubmit)="save()"><section class="form-card"><label class="check-row"><input type="checkbox" formControlName="allowDirectRfq"/><span>{{i18n.text('allowDirectRfq')}}</span></label><div class="form-grid"><label class="ui-field"><span>{{i18n.text('maximumDirectRfq')}} ({{currency()}})</span><input type="number" min="0" step="0.000001" formControlName="maximumEstimatedAmountCompanyCurrency"/></label><label class="ui-field"><span>{{i18n.text('requiredRole')}}</span><select formControlName="allowedRoleName"><option value="">{{i18n.text('anyPermittedUser')}}</option>@for(role of roles();track role){<option [value]="role">{{role}}</option>}</select></label></div><label class="check-row"><input type="checkbox" formControlName="requireActiveSuppliers"/><span>{{i18n.text('requireActiveSuppliers')}}</span></label><p>{{i18n.text('purchaseSourcingHint')}}</p></section><footer class="form-actions"><a class="ui-button secondary" routerLink="/settings">{{i18n.text('back')}}</a><button class="ui-button primary" [disabled]="saving()||form.invalid||!form.dirty">{{saving()?i18n.text('saving'):i18n.text('save')}}</button></footer></form>}</section>
