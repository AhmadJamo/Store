<section class="settings-form-page"><app-page-header eyebrow="ADMIN" [title]="i18n.text('purchaseMatching')" [description]="i18n.text('purchaseMatchingDescription')"/>@if(loading()){<app-feedback-state kind="loading" [title]="i18n.text('loading')"/>}@else{@if(problem();as failure){<app-api-recovery [problem]="failure" [allowRetry]="false"/>}@if(saved()){<p class="save-status" role="status">{{i18n.text('purchaseMatchingSaved')}}</p>}<form appSafeFormShortcuts [saving]="saving()" (saveShortcut)="save()" [formGroup]="form" (ngSubmit)="save()"><section class="form-card"><div class="form-grid"><label class="ui-field"><span>{{i18n.text('quantityTolerancePercent')}}</span><input type="number" min="0" max="100" step="0.0001" formControlName="quantityTolerancePercent"/></label><label class="ui-field"><span>{{i18n.text('priceTolerancePercent')}}</span><input type="number" min="0" max="100" step="0.0001" formControlName="priceTolerancePercent"/></label></div><p>{{i18n.text('purchaseMatchingHint')}}</p></section><footer class="form-actions"><a class="ui-button secondary" routerLink="/settings">{{i18n.text('back')}}</a><button class="ui-button primary" [disabled]="saving()||form.invalid||!form.dirty">{{saving()?i18n.text('saving'):i18n.text('save')}}</button></footer></form>}</section>
