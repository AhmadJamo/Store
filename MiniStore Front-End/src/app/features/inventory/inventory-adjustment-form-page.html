<section class="adjustments-page" [attr.aria-label]="i18n.text('newInventoryCount')">
  <app-page-header [eyebrow]="i18n.text('inventoryNavigation')" [title]="i18n.text('newInventoryCount')" [description]="i18n.text('newInventoryCountDescription')"><a class="ui-button secondary" routerLink="/inventory/adjustments">{{ i18n.text('backToAdjustments') }}</a></app-page-header>
  @if (problem()) { <app-form-error-summary [title]="problem()" [errors]="{}" /> }
  @if (!page()) { <app-feedback-state kind="loading" [title]="i18n.text('loadingAdjustmentForm')" /> }
  @else {
    <form class="adjustment-form" [formGroup]="form" (ngSubmit)="save()">
      <app-form-section [title]="i18n.text('countScope')" [description]="i18n.text('countScopeDescription')">
        <div class="form-grid">
          <label class="ui-field"><app-field-cue [label]="i18n.text('warehouse')" [required]="true" [requiredText]="i18n.text('requiredField')" [optionalText]="i18n.text('optionalField')" /><select formControlName="warehouseId"><option [ngValue]="0">{{ i18n.text('selectWarehouse') }}</option>@for (warehouse of page()!.warehouses; track warehouse.id) { <option [ngValue]="warehouse.id">{{ warehouse.name }}</option> }</select></label>
          <label class="ui-field"><app-field-cue [label]="i18n.text('location')" [requiredText]="i18n.text('requiredField')" [optionalText]="i18n.text('optionalField')" /><select formControlName="storageLocationId"><option [ngValue]="null">{{ i18n.text('unassignedSystem') }}</option>@for (location of locations(); track location.id) { <option [ngValue]="location.id">{{ location.name }}</option> }</select></label>
        </div>
      </app-form-section>

      <app-form-section [title]="i18n.text('countMethod')" [description]="i18n.text('countMethodDescription')">
        <label class="ui-field"><app-field-cue [label]="i18n.text('reason')" [required]="true" [requiredText]="i18n.text('requiredField')" [optionalText]="i18n.text('optionalField')" /><input formControlName="reason" maxlength="250" /></label>
        <label class="check-row"><input type="checkbox" formControlName="isBlindCount" /> <span>{{ i18n.text('blindCountHelp') }}</span></label>
      </app-form-section>

      <app-form-section [title]="i18n.text('productSelection')" [description]="i18n.text('selectProductsHelp')">
        <fieldset class="product-selection"><legend class="sr-only">{{ i18n.text('products') }}</legend><div class="product-grid">@for (product of page()!.products; track product.id) { <label class="check-row"><input #choice type="checkbox" [checked]="selectedProducts().has(product.id)" (change)="toggleProduct(product.id, choice.checked)" /> <span>{{ product.name }}</span></label> }</div></fieldset>
      </app-form-section>

      <app-workflow-footer [label]="i18n.text('workflowActions')"><a secondary-actions class="ui-button secondary" routerLink="/inventory/adjustments">{{ i18n.text('cancel') }}</a><button class="ui-button primary" type="submit" [disabled]="saving()">{{ saving() ? i18n.text('saving') : i18n.text('createInventoryCount') }}</button></app-workflow-footer>
    </form>
  }
</section>
