<main class="module-hub">
  <app-page-header eyebrow="ERP" [title]="i18n.text(titleKey)" [description]="i18n.text(descriptionKey)" />
  @if (!sections().length) {
    <app-feedback-state kind="empty" [title]="i18n.text('noModuleDestinations')" [description]="i18n.text('noModuleDestinationsDescription')" />
  } @else {
    <div class="hub-sections">
      @for (section of sections(); track section.key) {
        <section class="hub-section" [attr.aria-labelledby]="'hub-' + section.key">
          <h2 [id]="'hub-' + section.key">{{ i18n.text(section.key) }}</h2>
          <div class="hub-grid">
            @for (item of section.items; track item.id) {
              <a class="hub-card" [routerLink]="item.route">
                <span aria-hidden="true">{{ item.icon }}</span>
                <strong>{{ i18n.text(item.labelKey) }}</strong>
                <small>{{ i18n.text('openWorkspace') }}</small>
              </a>
            }
          </div>
        </section>
      }
    </div>
  }
</main>
