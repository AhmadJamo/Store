<section class="builder-page"><app-page-header eyebrow="BI" [title]="i18n.text('reportBuilder')" [description]="i18n.text('reportBuilderDescription')"><a class="ui-button secondary" routerLink="/analytics">{{ i18n.text('backToAnalytics') }}</a></app-page-header>
@if (loading()) { <app-feedback-state kind="loading" [title]="i18n.text('loading')" /> } @else if (problem(); as failure) { <app-api-recovery [problem]="failure" (retry)="load()" /> }
@else if (builder(); as source) { @if (command; as form) { <form (submit)="$event.preventDefault(); save()"><section class="builder-card"><h2>{{ i18n.text('workspaceIdentity') }}</h2><div class="form-grid"><label><span>{{ i18n.text('workspaceName') }}</span><input required maxlength="150" [value]="form.name" (input)="form.name = $any($event.target).value" /></label><label><span>{{ i18n.text('workspaceNameArabic') }}</span><input maxlength="150" [value]="form.nameArabic" (input)="form.nameArabic = $any($event.target).value" /></label><label><span>{{ i18n.text('analyticsModule') }}</span><select [value]="form.moduleKey" (change)="moduleChanged($any($event.target).value)">@for (module of source.modules; track module.key) { <option [value]="module.key">{{ i18n.locale() === 'ar-JO' ? module.titleArabic : module.title }}</option> }</select></label><label><span>{{ i18n.text('layoutColumns') }}</span><input type="number" min="1" max="4" [value]="form.layoutColumns" (input)="form.layoutColumns = +$any($event.target).value" /></label><label><span>{{ i18n.text('defaultPeriodDays') }}</span><input type="number" min="1" max="731" [value]="form.defaultPeriodDays" (input)="form.defaultPeriodDays = +$any($event.target).value" /></label><label><span>{{ i18n.text('refreshInterval') }}</span><select [value]="form.refreshIntervalMinutes" (change)="form.refreshIntervalMinutes = +$any($event.target).value"><option value="0">{{ i18n.text('manualRefresh') }}</option><option value="5">5</option><option value="15">15</option><option value="30">30</option><option value="60">60</option></select></label></div><label class="check"><input type="checkbox" [checked]="form.isDefault" (change)="form.isDefault = $any($event.target).checked" /> {{ i18n.text('defaultWorkspace') }}</label></section><section class="builder-card"><h2>{{ i18n.text('reportWidgets') }}</h2><div class="widget-options">@for (widget of widgets(); track widget.widgetKey) { <label class="widget-option"><input type="checkbox" [checked]="widget.isSelected" (change)="widget.isSelected = $any($event.target).checked" /><span><strong>{{ widget.widgetKey }}</strong><small>{{ i18n.text('widgetCustomizationHint') }}</small></span><select [value]="widget.columnSpan" (change)="widget.columnSpan = +$any($event.target).value" [disabled]="!widget.isSelected"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option></select></label> }</div></section><div class="builder-actions"><button class="ui-button primary" type="submit" [disabled]="saving()">{{ saving() ? i18n.text('saving') : i18n.text('saveWorkspace') }}</button></div></form> } }
</section>
